<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Hum player</title>
<script>
  // 主題:?theme=dark|light;沒指定就跟著訪客的系統設定
  (function () {
    var q = new URLSearchParams(location.search).get('theme');
    var t = q === 'dark' || q === 'light' ? q : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.className = t;
  })();
</script>
<link rel="stylesheet" href="/theme.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { font: 14px/1.4 var(--sans); color: var(--fg); overflow: hidden; }
  :focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
  .mini { height: 100%; min-height: 68px; background: var(--bg); border-radius: 18px; padding: 10px 14px; display: flex; align-items: center; gap: 12px; }
  .mv { position: relative; width: 52px; height: 52px; border-radius: 12px; background: var(--panel); flex: none; overflow: hidden; }
  .mv canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
  .txt { flex: 1; min-width: 0; }
  .t { font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s { color: var(--muted); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
  .s.err { color: var(--danger); }
  .play { position: relative; width: 42px; height: 42px; flex: none; border-radius: 50%; border: 0; background: var(--btn); color: var(--btnfg); display: grid; place-items: center; cursor: pointer; padding: 0; transition: transform .1s; }
  .play:active { transform: scale(.94); }
  .play svg { grid-area: 1 / 1; width: 18px; height: 18px; fill: currentColor; }
  .play .i-pause { display: none; } .play.playing .i-pause { display: block; } .play.playing .i-play { display: none; }
  .play::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2px solid transparent; border-top-color: var(--fg); opacity: 0; pointer-events: none; animation: spin 1s linear infinite; transition: opacity .2s; }
  .play.loading::after { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .play::after { animation: none; } }
</style>
</head>
<body>
<div class="mini">
  <div class="mv"><canvas id="vis" aria-hidden="true"></canvas></div>
  <div class="txt">
    <div id="title" class="t">Radio Hum</div>
    <div id="sub" class="s" role="status"></div>
  </div>
  <button id="play" class="play" type="button" aria-label="Play">
    <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.6" height="14" rx="1.3"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.3"/></svg>
  </button>
</div>

<script src="/i18n.js"></script>
<script src="/core.js"></script>
<script src="/vis.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const q = new URLSearchParams(location.search);
  const parts = location.pathname.split('/').filter(Boolean); // ['embed', 頻道, 曲風?]
  const channel = parts[1], genre = parts[2] || '';
  const key = q.get('key') || '';
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

  const audio = new Audio();
  const player = RadioPlayer(audio, {
    key,
    onStatus: (msg) => { const s = $('sub'); s.textContent = msg; s.classList.toggle('err', /lost|not support|again/i.test(msg)); $('play').classList.toggle('loading', /connecting|loading/i.test(msg)); },
    onTrack: (info) => {
      const tags = info.tags ? Object.values(info.tags).filter((v) => v && v !== '—').slice(0, 3).join(' · ') : '';
      $('sub').textContent = tags || [info.title, info.artist].filter(Boolean).join(' · ');
    },
    onDenied: () => { $('title').textContent = t('cannotPlay'); const s = $('sub'); s.textContent = t('cannotPlayWhy'); s.classList.add('err'); $('play').classList.remove('loading'); },
  });

  // 頻道名稱(公開資料,不需要金鑰)
  fetch('/api/channels').then((r) => r.json()).then((d) => {
    const c = d.channels.find((x) => x.id === channel);
    if (c) { $('title').textContent = c.name; $('sub').textContent = c.description || ''; }
  }).catch(() => {});

  const vis = new Visualizer($('vis'), audio);
  vis.setBassTargets([]);
  vis.setLight(root.classList.contains('light'));
  vis.setColor(getComputedStyle(root).getPropertyValue('--bar').trim());
  const style = q.get('vis') || (reduce ? 'off' : 'center');
  vis.setStyle(style);
  if (style !== 'off') vis.start();

  audio.addEventListener('playing', () => $('play').classList.remove('loading'));
  audio.addEventListener('play', () => { $('play').classList.add('playing'); $('play').setAttribute('aria-label', 'Pause'); });
  audio.addEventListener('pause', () => { $('play').classList.remove('playing', 'loading'); $('play').setAttribute('aria-label', 'Play'); });

  let tuned = false;
  $('play').addEventListener('click', () => {
    if (!key) { $('sub').textContent = t('missingKey'); $('sub').classList.add('err'); return; }
    if (!audio.paused) return player.pause();
    if (!tuned) { player.tune(channel, genre); tuned = true; }
    player.play(); // 瀏覽器規定:有聲音的播放一定要使用者點擊才能開始
  });
})();
</script>
</body>
</html>
