<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>電台播放器</title>
<link rel="stylesheet" href="/theme.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font: 400 14px/1.4 var(--font); overflow: hidden; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { height: 100%; min-height: 72px; display: flex; align-items: center; gap: 14px; padding: 8px 16px; border: 1px solid var(--line); border-radius: 12px; }
  #play { position: relative; flex: none; width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; display: grid; place-items: center; }
  #play:hover { opacity: .85; }
  #play svg { grid-area: 1 / 1; width: 20px; height: 20px; }
  #play .i-pause { opacity: 0; } #play.playing .i-pause { opacity: 1; } #play.playing .i-play { opacity: 0; }
  #play::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; opacity: 0; pointer-events: none; border: 2px solid var(--line); border-top-color: var(--text); animation: spin 1s linear infinite; }
  #play.loading::after { opacity: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .info { min-width: 0; flex: 1; }
  .title { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sub { color: var(--muted); font-size: .85em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .err { color: var(--danger); }
  canvas { flex: none; width: 90px; height: 40px; }
  .vol { display: flex; align-items: center; gap: 6px; color: var(--muted); }
  input[type=range] { width: 76px; accent-color: var(--accent); }
  @media (max-width: 420px) { canvas, .vol input { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <button id="play" aria-label="播放">
    <svg class="i-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5Z"/></svg>
    <svg class="i-pause" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.5" height="14" rx="1.2"/><rect x="13.5" y="5" width="4.5" height="14" rx="1.2"/></svg>
  </button>
  <div class="info">
    <div id="title" class="title">按下播放</div>
    <div id="where" class="sub">直播</div>
    <div id="status" class="sub"></div>
  </div>
  <canvas id="vis" aria-hidden="true"></canvas>
  <label class="vol" title="音量">音量 <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="音量" /></label>
</div>
<script src="/core.js"></script>
<script src="/vis.js"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const root = document.documentElement;
  const q = new URLSearchParams(location.search);
  const parts = location.pathname.split('/').filter(Boolean); // ['embed', 頻道, 曲風?]
  const channel = parts[1], genre = parts[2] || '';
  const key = q.get('key') || '';

  const dark = q.get('theme') === 'dark'; // 預設白底;?theme=dark 為深色
  if (dark) root.classList.add('dark');

  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const audio = new Audio();
  const player = RadioPlayer(audio, {
    key,
    onStatus: (t) => { const s = $('status'); s.textContent = t; s.classList.toggle('err', /中斷|不支援/.test(t)); $('play').classList.toggle('loading', /連線中|載入中/.test(t)); },
    onTrack: (i) => { $('title').textContent = i.title; $('where').textContent = (i.artist ? i.artist + ' ・ ' : '') + '直播'; },
    onDenied: () => { $('title').textContent = '無法播放'; $('status').textContent = '金鑰無效、網站未授權,或訂閱已到期'; $('status').classList.add('err'); $('play').classList.remove('loading'); },
  });
  const vis = new Visualizer($('vis'), audio);
  vis.setLight(!dark);
  vis.setBassTargets([]);
  const style = q.get('vis') || (reduce ? 'off' : 'bars');
  vis.setStyle(style);
  $('vis').style.display = style === 'off' ? 'none' : '';
  if (style !== 'off') vis.start();

  audio.addEventListener('playing', () => $('play').classList.remove('loading'));
  audio.addEventListener('play', () => { $('play').classList.add('playing'); $('play').setAttribute('aria-label', '暫停'); });
  audio.addEventListener('pause', () => { $('play').classList.remove('playing', 'loading'); $('play').setAttribute('aria-label', '播放'); });
  $('vol').addEventListener('input', (e) => (audio.volume = e.target.value));

  let tuned = false;
  $('play').addEventListener('click', () => {
    if (!key) { $('status').textContent = '嵌入網址缺少 key 參數'; $('status').classList.add('err'); return; }
    if (!audio.paused) return player.pause();
    if (!tuned) { player.tune(channel, genre); tuned = true; }
    player.play(); // 瀏覽器規定:有聲音的播放一定要使用者點擊才能開始
  });
})();
</script>
</body>
</html>
