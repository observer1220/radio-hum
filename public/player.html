<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Hum</title>
<script>
  // 先決定黑 / 白主題再畫畫面,避免閃一下:有存過偏好就用,沒有就跟著系統
  (function () {
    var t = null;
    try { t = localStorage.getItem('theme'); } catch (e) { /* ignore */ }
    if (t !== 'dark' && t !== 'light') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.className = t;
  })();
</script>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/player.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.17/hls.min.js"></script>
</head>
<body>
<header class="top">
  <span class="brand">RADIO HUM</span>
  <span class="sp"></span>
  <a id="btn-tracker" class="link hidden" href="/tracker">Tracker</a>
  <a id="btn-admin" class="link hidden" href="#" target="_blank" rel="noopener">Users</a>
  <button id="btn-embed" class="link" type="button">Embed</button>
  <span id="who" class="who"></span>
  <a id="btn-login" class="link hidden" href="/auth/login?next=/">Sign in</a>
  <button id="btn-logout" class="link hidden" type="button">Sign out</button>
  <button id="btn-theme" class="tbtn" type="button" aria-label="Switch light / dark" title="Switch light / dark">
    <svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 0 18V3z"/><path d="M12 3a9 9 0 0 1 0 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
  </button>
</header>

<main>
  <article class="card paused" id="card">
    <div class="ctop"><span>LIVE RADIO</span><span id="badge" class="badge" aria-live="off"></span><span id="live" class="live">LIVE</span></div>
    <div id="channels" class="pills" role="group" aria-label="Channels"></div>

    <div class="viz">
      <canvas id="vis" aria-hidden="true"></canvas>
      <div id="recipe" class="recipe"></div>
    </div>

    <div class="info">
      <div class="meta">
        <h2 id="title" class="title">Pick a channel</h2>
        <p id="sub" class="sr" aria-live="polite"></p>
      </div>
      <div class="tools">
        <button id="btn-eq" class="icon" type="button" aria-label="Equalizer" title="Equalizer">
          <svg viewBox="0 0 24 24"><path d="M5 3h2v6H5zM5 13h2v8H5zM3 9h6v4H3zM11 3h2v10h-2zM11 17h2v4h-2zM9 13h6v4H9zM17 3h2v3h-2zM17 10h2v11h-2zM15 6h6v4h-6z"/></svg>
        </button>
        <button id="btn-timer" class="icon" type="button" aria-label="Sleep timer and alarm" title="Sleep timer and alarm">
          <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 0 0 16 8 8 0 0 0 0-16zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12zm-1 2v4.4l3 1.8.9-1.5-2.4-1.4V8zM3.3 6.6 6.6 3.3 5.2 1.9 1.9 5.2zM20.7 6.6l-3.3-3.3 1.4-1.4 3.3 3.3z"/></svg>
        </button>
        <button id="btn-recipe" class="icon hidden" type="button" aria-label="Recipe" title="Recipe">
          <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1.1 15h-2.2v-6h2.2v6zm0-8.1h-2.2V6.8h2.2v2.1z"/></svg>
        </button>
      </div>
    </div>
    <canvas id="lcd" class="lcd" aria-hidden="true"></canvas>

    <div class="prog" aria-hidden="true"><i id="prog"></i></div>
    <div class="times" aria-hidden="true"><span id="t-el"></span><span id="t-rem"></span></div>

    <div class="ctrl">
      <label class="vol" title="Volume">
        <svg viewBox="0 0 24 24"><path d="M3 9.5v5h3.6L11 19V5L6.6 9.5H3zm12.5 2.5a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5z"/></svg>
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" aria-label="Volume" />
      </label>
      <div class="side">
        <button id="btn-prev" class="icon" type="button" aria-label="Previous channel" title="Previous channel"><svg viewBox="0 0 24 24"><path d="M6 6h2.2v12H6zM9.6 12l9-6.2v12.4z"/></svg></button>
        <button id="play" class="play" type="button" aria-label="Play">
          <svg class="i-play" viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24"><rect x="6" y="5" width="4.6" height="14" rx="1.3"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.3"/></svg>
        </button>
        <button id="btn-next" class="icon" type="button" aria-label="Next channel" title="Next channel"><svg viewBox="0 0 24 24"><path d="M15.8 6H18v12h-2.2zM14.4 12l-9 6.2V5.8z"/></svg></button>
      </div>
      <span></span>
    </div>

    <div id="genres" class="pills genres" role="group" aria-label="Genres"></div>
    <div id="status" class="status" role="status"></div>
  </article>
</main>

<dialog id="embed-dialog">
  <h3 id="d-title">Embed on your website</h3>
  <p id="d-intro" class="muted"></p>

  <!-- 沒登入 / 沒開通時的說明與按鈕 -->
  <div id="embed-state"></div>

  <!-- 已開通的帳號:管理嵌入金鑰 -->
  <div id="embed-keys" class="hidden">
    <p id="d-keyshelp" class="muted"></p>
    <div id="key-list"></div>
    <h4 id="d-newkey">New key</h4>
    <div class="row"><input id="key-label" type="text" /></div>
    <div class="row"><textarea id="key-origins" rows="3"></textarea></div>
    <div class="row"><button id="key-create" class="btn primary" type="button"></button><span id="key-msg" class="muted"></span></div>
  </div>

  <div class="row"><button id="embed-close" class="btn" type="button">Close</button></div>
</dialog>

<script src="/i18n.js"></script>
<script src="/core.js"></script>
<script src="/fx.js"></script>
<script src="/vis.js"></script>
<script src="/lcd.js"></script>
<script src="/tools.js"></script>
<script src="/player.js"></script>
</body>
</html>
