<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Suno 提示詞管理 | Radio Hum</title>
<style>
  :root { --bg:#fff; --text:#111; --muted:#6b6b6b; --line:#e3e3e3; --surface:#f6f6f6; --accent:#111; --ok:#1e8e4e; --warn:#c77d00; --no:#9a9a9a; --danger:#c0392b; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.6 system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; color:var(--text); background:var(--bg); }
  header { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:5; }
  header h1 { font-size:1.05rem; margin:0 8px 0 0; }
  .spacer { flex:1; }
  main { max-width:1240px; margin:0 auto; padding:20px; }
  button, select, input, textarea { font:inherit; color:inherit; }
  .btn { border:1px solid var(--line); background:#fff; border-radius:8px; padding:6px 12px; cursor:pointer; }
  .btn:hover { border-color:var(--text); }
  .btn.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn.small { padding:2px 9px; font-size:.82rem; }
  .btn.danger { color:var(--danger); }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; }
  .tab { border:1px solid var(--line); background:#fff; border-radius:999px; padding:5px 14px; cursor:pointer; }
  .tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .muted { color:var(--muted); font-size:.85rem; }
  .bar { height:8px; background:var(--surface); border-radius:99px; overflow:hidden; min-width:120px; }
  .bar i { display:block; height:100%; background:var(--ok); }
  .card { border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin:10px 0; }
  .card .top { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .id { font:600 .85rem ui-monospace,Menlo,Consolas,monospace; }
  .prompt { background:var(--surface); border-radius:8px; padding:8px 10px; margin:8px 0; font:.88rem/1.5 ui-monospace,Menlo,Consolas,monospace; word-break:break-word; }
  .picks { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
  .pick { background:#fff; border:1px solid var(--line); border-radius:999px; padding:1px 10px; font-size:.82rem; }
  .status { display:inline-flex; gap:4px; flex-wrap:nowrap; }
  .st { border:1px solid var(--line); background:#fff; border-radius:999px; padding:2px 11px; cursor:pointer; font-size:.85rem; white-space:nowrap; flex:none; }
  .st.on-kept { background:var(--ok); color:#fff; border-color:var(--ok); }
  .st.on-pending { background:var(--warn); color:#fff; border-color:var(--warn); }
  .st.on-rejected { background:var(--no); color:#fff; border-color:var(--no); }
  input[type=text], input[type=number], textarea, select { border:1px solid var(--line); border-radius:8px; padding:6px 9px; background:#fff; }
  input[type=text], textarea { width:100%; }
  table { width:100%; border-collapse:collapse; font-size:.88rem; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { white-space:nowrap; }
  /* 紀錄表:狀態欄不准把「待聽 / 留下 / 淘汰」壓成直式;歌名、備註給足寬度,可以拉高看完整內容 */
  td.col-id { white-space:nowrap; }
  td.col-status { min-width:250px; white-space:nowrap; }
  td.col-status select { margin-top:4px; }
  td.col-picks { min-width:260px; }
  td.col-title, td.col-note { min-width:240px; }
  td textarea { width:100%; min-width:220px; resize:vertical; line-height:1.4; }
  td.col-actions { white-space:nowrap; }
  .table-wrap { overflow-x:auto; }
  th { color:var(--muted); font-weight:500; white-space:nowrap; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
  .axis h4 { margin:0 0 6px; font-size:.9rem; }
  .opt { display:grid; grid-template-columns:1fr 34px; gap:8px; align-items:center; margin:3px 0; font-size:.85rem; }
  .opt .t { overflow-wrap:anywhere; }
  .opt.zero .t { color:var(--danger); }
  .opt .bar { min-width:0; margin-top:3px; }
  .help { background:var(--surface); border-radius:10px; padding:10px 14px; font-size:.88rem; }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin:8px 0; }
  svg text { font:12px system-ui,"PingFang TC","Microsoft JhengHei",sans-serif; }
  .hidden { display:none !important; }
  @media (max-width:600px){ main{padding:12px} }
</style>
</head>
<body>
<header>
  <h1>Suno 提示詞管理器</h1>
  <a class="btn small" href="/">回播放器</a>
  <a class="btn small" id="hubLink" href="#" target="_blank" rel="noopener">開通使用者(auth-hub)</a>
  <div id="channelTabs" class="tabs"></div>
  <span class="spacer"></span>
  <span id="who" class="muted"></span>
  <span id="saved" class="muted"></span>
  <button class="btn small" id="btnCsv" title="用 Excel 開啟">匯出 Excel(CSV)</button>
  <button class="btn small" id="btnJson">備份(JSON)</button>
  <label class="btn small">還原 / 匯入<input id="fileImport" type="file" accept=".json,application/json" hidden></label>
</header>

<main>
  <div class="row">
    <div class="tabs" id="viewTabs"></div>
    <span class="spacer"></span>
    <span id="progressText" class="muted" style="font-weight:600;color:var(--text)"></span>
    <div class="bar" style="width:140px"><i id="progressBar" style="width:0"></i></div>
  </div>
  <div id="view">載入中…</div>
  <p class="muted" style="margin-top:32px">資料自動存到雲端(只有管理員看得到),換電腦也在。建議偶爾按右上角「備份(JSON)」留一份。</p>
</main>

<script>
/* ===================== 資料(存在雲端,只有管理員能讀寫) ===================== */
let DEFAULT_CFG = null;      // 預設基底與選項,來自伺服器(prompts/axes.json)
let db = null;               // { cfg, log }
let version = 0;             // 樂觀鎖版本號:兩個分頁同時編輯時,後存的會被擋下
let channel = null;
let view = 'gen';
let filter = 'all';
const LEGACY_KEY = 'promptTracker.v1'; // 舊的本機版資料(只用於一次性搬到雲端)

const $ = (id) => document.getElementById(id);

let saving = false, dirty = false, timer = 0;
function save() {
  dirty = true;
  $('saved').textContent = '儲存中…';
  clearTimeout(timer);
  timer = setTimeout(flush, 500);
}
async function flush() {
  if (saving) { timer = setTimeout(flush, 300); return; }
  if (!dirty) return;
  saving = true; dirty = false;
  try {
    const r = await fetch('/api/tracker', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ data: db, version }) });
    const j = await r.json().catch(() => ({}));
    if (r.status === 409) { alert('這份資料已經在別的分頁或電腦被更新了。\n為避免蓋掉對方的修改,頁面將重新載入。'); dirty = false; location.reload(); return; }
    if (!r.ok) throw new Error(j.error || 'HTTP ' + r.status);
    version = j.version;
    $('saved').textContent = '已儲存到雲端 ' + new Date().toLocaleTimeString();
  } catch (e) {
    dirty = true;
    $('saved').textContent = '⚠ 儲存失敗:' + e.message + '(稍後會自動重試,或先按「備份」)';
    timer = setTimeout(flush, 5000);
  } finally { saving = false; }
}
window.addEventListener('beforeunload', (e) => { if (dirty || saving) { e.preventDefault(); e.returnValue = ''; } });
const cfgOf = (c) => db.cfg.channels[c || channel];
const logOf = (c) => db.log.filter((r) => r.channel === (c || channel));

/* ===================== 小工具 ===================== */
function h(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (k === 'class') n.className = v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (k === 'value') n.value = v;
    else n.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null) n.append(kid);
  return n;
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { const t = h('textarea', { style: 'position:fixed;opacity:0' }); t.value = text; document.body.append(t); t.select(); document.execCommand('copy'); t.remove(); }
  if (btn) { const old = btn.textContent; btn.textContent = '已複製 ✓'; setTimeout(() => (btn.textContent = old), 1200); }
}
const buildPrompt = (ch, picks) => [ch.base, ...Object.keys(ch.axes).map((a) => picks[a]).filter(Boolean)].join(', ');
const combos = (axes) => Object.entries(axes).reduce((acc, [axis, opts]) => acc.flatMap((c) => opts.map((o) => ({ ...c, [axis]: o }))), [{}]);
const distance = (axes, a, b) => Object.keys(axes).filter((k) => a[k] !== b[k]).length;
const nextId = (c) => c + '-' + String(Math.max(0, ...logOf(c).map((r) => Number(r.id.split('-')[1]))) + 1).padStart(4, '0');
const STATUS = { pending: '待聽', kept: '留下', rejected: '淘汰' };

// Suno 一次生成兩首。「歌名」欄可以填多個,用逗號隔開(半形 , 全形 , 頓號 、 都可以)
const splitNames = (str) => String(str || '').split(/[,\uFF0C\u3001;\uFF1B\n]+/).map((x) => x.trim()).filter(Boolean);
// 這組提示詞「留下了幾首歌」:不是留下就是 0;填了幾個歌名就至少算幾首;沒填就看下拉(預設 1 首)
const songCount = (r) => (r.status === 'kept' ? Math.max(r.songs || 1, splitNames(r.title).length) : 0);
// 留下時才出現的小下拉:這組提示詞兩首都留,選「留 2 首」;或直接在歌名欄用逗號填兩個名字
function songsControl(r, after) {
  if (r.status !== 'kept') return null;
  const sel = h('select', { title: 'Suno 一次生成兩首,這組提示詞留下了幾首', onchange: (e) => { r.songs = Number(e.target.value); save(); after(); } },
    h('option', { value: '1' }, '留 1 首'), h('option', { value: '2' }, '留 2 首'));
  sel.value = String(Math.min(2, songCount(r)));
  return sel;
}

/* ===================== 產生下一批(盡量和用過的不同) ===================== */
function generate(n) {
  const ch = cfgOf();
  const used = logOf();
  const usedKeys = new Set(used.map((r) => JSON.stringify(r.picks)));
  const pool = combos(ch.axes).filter((c) => !usedKeys.has(JSON.stringify(c)));
  if (!pool.length) return alert('這個頻道所有組合都用過了,請到「設定」增加選項');
  const counts = {};
  for (const r of used.filter((r) => r.status !== 'rejected')) for (const [a, o] of Object.entries(r.picks)) counts[a + '|' + o] = (counts[a + '|' + o] || 0) + 1;
  const chosen = [];
  for (let i = 0; i < Math.min(n, pool.length); i++) {
    const ref = [...used.map((r) => r.picks), ...chosen.map((c) => c.c)];
    let best = null;
    for (const c of pool) {
      if (chosen.some((x) => x.c === c)) continue;
      const minDist = ref.length ? Math.min(...ref.map((p) => distance(ch.axes, c, p))) : Object.keys(ch.axes).length;
      const rarity = Object.entries(c).reduce((s, [a, o]) => s + 1 / (1 + (counts[a + '|' + o] || 0)), 0);
      const score = minDist * 100 + rarity * 10 + Math.random();
      if (!best || score > best.score) best = { c, score, minDist };
    }
    chosen.push(best);
    for (const [a, o] of Object.entries(best.c)) counts[a + '|' + o] = (counts[a + '|' + o] || 0) + 1;
  }
  const now = new Date().toISOString();
  const made = chosen.map((x) => { const r = { id: nextId(channel), channel, picks: x.c, status: 'pending', title: '', note: '', createdAt: now }; db.log.push(r); return r; });
  save();
  return made;
}

/* ===================== 補登舊提示詞(自動比對各軸選項) ===================== */
// 拿一段提示詞去比對某個頻道的各軸選項;回傳命中的選項、沒命中的軸
function matchPrompt(chId, t) {
  const ch = db.cfg.channels[chId]; const picks = {}; const missing = [];
  for (const [axis, opts] of Object.entries(ch.axes)) {
    const hit = opts.filter((o) => t.includes(o.toLowerCase())).sort((a, b) => b.length - a.length)[0];
    if (hit) picks[axis] = hit; else missing.push(axis);
  }
  // 基底提示詞的開頭一樣,幾乎可以確定就是這個頻道,給額外加分(兩個頻道選項剛好撞到時用來分高下)
  const baseHit = ch.base && t.includes(ch.base.toLowerCase().slice(0, 40)) ? 3 : 0;
  return { picks, missing, hits: Object.keys(picks).length, score: Object.keys(picks).length + baseHit };
}

// 不用先選對頻道:會拿所有頻道去比對,挑「命中最多」的;目前頻道平手時留在目前頻道
// wantCh:你選的頻道(空字串 = 自動判斷);title:歌名
function backfill(text, status, wantCh, title) {
  const t = text.toLowerCase();
  let best;
  if (wantCh) {
    // 你明確選了頻道:只拿這個頻道的選項比對
    best = { chId: wantCh, ...matchPrompt(wantCh, t) };
    if (!best.hits) return { error: '這段提示詞和「' + db.cfg.channels[wantCh].name + '」頻道的選項對不上。如果不確定是哪個頻道,頻道請選「自動判斷」。' };
  } else {
    best = { chId: channel, ...matchPrompt(channel, t) };
    for (const chId of Object.keys(db.cfg.channels)) {
      if (chId === channel) continue;
      const m = matchPrompt(chId, t);
      if (m.score > best.score) best = { chId, ...m };
    }
    if (!best.hits) return { error: '在這段文字裡找不到任何頻道的選項。請確認貼的是 Suno 的 Style 提示詞(含 bpm、場景等),或先到「設定」確認各軸選項。' };
  }
  const switchedFrom = best.chId !== channel ? channel : null;
  if (switchedFrom) channel = best.chId; // nextId / logOf 都看目前頻道,所以先切過去
  if (logOf().some((r) => JSON.stringify(r.picks) === JSON.stringify(best.picks))) return { error: '這個組合已經在「' + cfgOf().name + '」的紀錄裡了', switched: !!switchedFrom };
  const rec = { id: nextId(channel), channel, picks: best.picks, status, title: (title || '').trim(), songs: Math.max(1, splitNames(title).length), note: '補登', createdAt: new Date().toISOString() };
  db.log.push(rec); save();
  return { rec, missing: best.missing, switched: !!switchedFrom };
}

/* ===================== 畫面 ===================== */
let lastBatch = []; // 這次剛產生的
let flash = ''; // 補登時自動切換頻道會整頁重畫,訊息先存在這裡,重畫後顯示
function statusButtons(r, rerender) {
  return h('span', { class: 'status' }, Object.entries(STATUS).map(([k, label]) =>
    h('button', { class: 'st' + (r.status === k ? ' on-' + k : ''), onclick: () => { r.status = k; save(); rerender(); } }, label)));
}
function cardFor(r, rerender) {
  const ch = cfgOf(r.channel);
  const prompt = buildPrompt(ch, r.picks);
  return h('div', { class: 'card' },
    h('div', { class: 'top' },
      h('span', { class: 'id' }, r.id),
      statusButtons(r, rerender),
      songsControl(r, rerender),
      h('span', { class: 'spacer' }),
      h('button', { class: 'btn small', onclick: (e) => copy(prompt, e.target) }, '複製提示詞')),
    h('div', { class: 'prompt' }, prompt),
    h('div', { class: 'picks' }, Object.entries(r.picks).map(([a, o]) => h('span', { class: 'pick', title: a }, o))),
    h('div', { class: 'row' },
      h('input', { type: 'text', placeholder: '歌名(兩首都留就用逗號隔開,例如:Rainy Window, Quiet Spa)', value: r.title || '', style: 'flex:1;min-width:180px', onchange: (e) => { r.title = e.target.value; save(); rerender(); } }),
      h('input', { type: 'text', placeholder: '備註(例如:為什麼淘汰)', value: r.note || '', style: 'flex:1;min-width:180px', onchange: (e) => { r.note = e.target.value; save(); } })));
}

function viewGen() {
  const ch = cfgOf();
  const box = h('div');
  const n = h('input', { type: 'number', min: 1, max: 20, value: 5, style: 'width:70px' });
  const list = h('div');
  const draw = () => { list.replaceChildren(...lastBatch.filter((r) => db.log.includes(r)).map((r) => cardFor(r, () => { draw(); renderHeader(); }))); };
  box.append(
    h('div', { class: 'help' }, '按「產生」會挑出和你之前用過的組合差最多的提示詞。複製到 Suno 之後,聽完在卡片上按「留下」或「淘汰」。Suno 一次生成兩首:兩首都留的話,選「留 2 首」,或在歌名欄用逗號隔開兩個名字,進度會自動算成 2 首。'),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', onclick: () => { const made = generate(Math.max(1, Number(n.value) || 5)); if (made) { lastBatch = made; draw(); renderHeader(); } } }, '產生'),
      n, h('span', null, '組提示詞'),
      h('span', { class: 'spacer' }),
      h('span', { class: 'muted' }, 'Exclude 欄:'),
      h('button', { class: 'btn small', onclick: (e) => copy(db.cfg.exclude, e.target) }, '複製排除詞')),
    list);
  draw();
  const pend = logOf().filter((r) => r.status === 'pending' && !lastBatch.includes(r));
  if (pend.length) box.append(h('p', { class: 'muted' }, '還沒聽完的(' + pend.length + ' 組)請到「紀錄」分頁處理。'));
  return box;
}

function viewLog() {
  const box = h('div');
  const rows = h('tbody');
  const tools = h('div', { class: 'row' },
    h('span', { class: 'muted' }, '篩選:'),
    ...['all', 'pending', 'kept', 'rejected'].map((k) => h('button', { class: 'tab' + (filter === k ? ' active' : ''), onclick: () => { filter = k; render(); } }, k === 'all' ? '全部' : STATUS[k])),
    h('span', { class: 'spacer' }),
    h('button', { class: 'btn small', title: '歌名欄是空的、備註有內容的紀錄,把備註搬到歌名欄(只處理目前這個頻道)', onclick: () => migrateNotes() }, '把備註裡的歌名搬到歌名欄'));
  // 以前歌名是寫在備註(用逗號隔開)。歌名欄空白、備註有內容(不是自動填的「補登」)的紀錄,把備註移過去
  const migrateNotes = () => {
    const todo = logOf().filter((r) => !(r.title || '').trim() && (r.note || '').trim() && r.note.trim() !== '補登');
    if (!todo.length) return alert('沒有需要搬的紀錄。\n(只有「歌名欄是空的、備註有內容」的紀錄會被處理)');
    const sample = todo.slice(0, 5).map((r) => r.id + ':「' + r.note.trim() + '」').join('\n');
    if (!confirm('目前頻道有 ' + todo.length + ' 筆紀錄的歌名是空的、備註有內容。\n要把備註的內容移到「歌名」欄嗎?(備註會清空,之後都還能再編輯)\n\n例如:\n' + sample)) return;
    for (const r of todo) { r.title = r.note.trim(); r.note = ''; }
    save(); render();
  };
  const draw = () => {
    const list = logOf().filter((r) => filter === 'all' || r.status === filter).slice().reverse();
    rows.replaceChildren(...list.map((r) => h('tr', null,
      h('td', { class: 'id col-id' }, r.id),
      h('td', { class: 'col-status' }, statusButtons(r, () => { draw(); renderHeader(); }), h('br'), songsControl(r, () => { draw(); renderHeader(); })),
      h('td', { class: 'col-title' }, h('textarea', { rows: 2, value: r.title || '', placeholder: '歌名(兩首都留就用逗號隔開)', onchange: (e) => { r.title = e.target.value; save(); draw(); renderHeader(); } })),
      h('td', { class: 'col-picks' }, Object.values(r.picks).join(' / ')),
      h('td', { class: 'col-note' }, h('textarea', { rows: 2, value: r.note || '', placeholder: '備註', onchange: (e) => { r.note = e.target.value; save(); } })),
      h('td', { class: 'col-actions' },
        h('button', { class: 'btn small', onclick: (e) => copy(buildPrompt(cfgOf(r.channel), r.picks), e.target) }, '複製'), ' ',
        h('button', { class: 'btn small danger', onclick: () => { if (confirm('刪除 ' + r.id + '?')) { db.log.splice(db.log.indexOf(r), 1); save(); draw(); renderHeader(); } } }, '刪除')))));
    if (!list.length) rows.append(h('tr', null, h('td', { colspan: 6, class: 'muted' }, '沒有紀錄')));
  };
  // 補登
  const ta = h('textarea', { rows: 3, placeholder: '貼上你以前用過的完整提示詞,按「補登」。會自動判斷是哪個頻道、並比對出每個軸用了哪個選項' });
  const st = h('select', null, h('option', { value: 'kept' }, '留下'), h('option', { value: 'rejected' }, '淘汰'), h('option', { value: 'pending' }, '待聽'));
  // 頻道:預設自動判斷(拿所有頻道去比對);也可以自己指定
  const chSel = h('select', null, h('option', { value: '' }, '自動判斷'),
    ...Object.entries(db.cfg.channels).map(([id, c]) => h('option', { value: id }, c.name || id)));
  const titleIn = h('input', { type: 'text', placeholder: '歌名,兩首都留就用逗號隔開(例如:Rainy Window, Quiet Spa)', style: 'flex:1;min-width:260px' });
  const msg = h('span', { class: 'muted' }, flash); flash = '';
  const add = h('div', { class: 'help' },
    h('strong', null, '補登舊紀錄'),
    ta,
    h('div', { class: 'row' }, '頻道:', chSel, '歌名:', titleIn),
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', onclick: () => {
        const res = backfill(ta.value, st.value, chSel.value, titleIn.value);
        if (res.error) { msg.textContent = res.error; if (res.switched) { flash = res.error; render(); } return; }
        const text = '已補登 ' + res.rec.id + (res.switched ? (chSel.value ? '(已切換到「' + cfgOf().name + '」頻道)' : '(自動判斷是「' + cfgOf().name + '」頻道,已切換過去)') : '')
          + (res.missing.length ? ';找不到對應選項而略過:' + res.missing.join('、') : '');
        if (res.switched) { flash = text; render(); return; } // 頻道變了,整頁重畫(分頁、進度、紀錄表都要換)
        msg.textContent = text;
        ta.value = ''; titleIn.value = ''; draw(); renderHeader();
      } }, '補登'), '狀態:', st, msg));
  box.append(tools, h('div', { class: 'table-wrap' }, h('table', null, h('thead', null, h('tr', null, ['編號', '狀態', '歌名', '組合', '備註', ''].map((t) => h('th', null, t)))), rows)), h('div', { style: 'height:16px' }), add);
  draw();
  return box;
}

function viewCoverage() {
  const ch = cfgOf();
  const recs = logOf().filter((r) => r.status !== 'rejected');
  const count = (axis, o) => recs.filter((r) => r.picks[axis] === o).length;
  const max = Math.max(1, ...Object.entries(ch.axes).flatMap(([a, opts]) => opts.map((o) => count(a, o))));
  const total = combos(ch.axes).length;
  const box = h('div');
  box.append(h('p', { class: 'muted' }, '已用 ' + logOf().length + ' / ' + total + ' 種組合。紅字 = 這個選項還沒用過。'));
  box.append(h('div', { class: 'grid' }, Object.entries(ch.axes).map(([axis, opts]) =>
    h('div', { class: 'axis card' }, h('h4', null, axis), opts.map((o) => {
      const c = count(axis, o);
      return h('div', { class: 'opt' + (c ? '' : ' zero') },
        h('div', null, h('div', { class: 't' }, o), h('div', { class: 'bar' }, h('i', { style: 'width:' + (c / max) * 100 + '%' }))),
        h('div', { class: 'muted', style: 'text-align:right' }, String(c)));
    })))));
  box.append(h('h3', { style: 'margin-top:28px' }, '心智圖'), mindmap(ch, count));
  return box;
}

function mindmap(ch, count) {
  const NS = 'http://www.w3.org/2000/svg';
  const axes = Object.entries(ch.axes);
  const ROW = 26, X0 = 14, X1 = 190, X2 = 400, W = 760;
  const leaves = axes.reduce((s, [, o]) => s + o.length, 0);
  const H = leaves * ROW + 30;
  const svg = document.createElementNS(NS, 'svg');
  svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H); svg.setAttribute('width', '100%'); svg.style.maxWidth = W + 'px';
  const el = (t, a, txt) => { const e = document.createElementNS(NS, t); for (const k in a) e.setAttribute(k, a[k]); if (txt != null) e.textContent = txt; svg.append(e); return e; };
  const curve = (x1, y1, x2, y2, color) => el('path', { d: 'M' + x1 + ' ' + y1 + ' C' + (x1 + 60) + ' ' + y1 + ' ' + (x2 - 60) + ' ' + y2 + ' ' + x2 + ' ' + y2, fill: 'none', stroke: color, 'stroke-width': 1.5 });
  let leaf = 0; const axisY = [];
  const leafData = [];
  axes.forEach(([axis, opts]) => {
    const ys = opts.map(() => 20 + leaf++ * ROW);
    axisY.push(ys.reduce((a, b) => a + b, 0) / ys.length);
    leafData.push(ys);
  });
  const rootY = axisY.reduce((a, b) => a + b, 0) / axisY.length;
  const max = Math.max(1, ...axes.flatMap(([a, o]) => o.map((x) => count(a, x))));
  axes.forEach(([axis, opts], i) => {
    curve(X0 + 90, rootY, X1, axisY[i], '#bbb');
    opts.forEach((o, j) => {
      const c = count(axis, o), y = leafData[i][j];
      curve(X1 + 70, axisY[i], X2, y, c ? '#1e8e4e' : '#ddd');
      el('circle', { cx: X2, cy: y, r: 4 + (c / max) * 5, fill: c ? '#1e8e4e' : '#fff', stroke: c ? '#1e8e4e' : '#bbb' });
      el('text', { x: X2 + 16, y: y + 4, fill: c ? '#111' : '#c0392b' }, o + (c ? '  ×' + c : ''));
    });
    el('rect', { x: X1, y: axisY[i] - 12, width: 70, height: 24, rx: 12, fill: '#111' });
    el('text', { x: X1 + 35, y: axisY[i] + 4, fill: '#fff', 'text-anchor': 'middle' }, axis);
  });
  el('rect', { x: X0, y: rootY - 14, width: 90, height: 28, rx: 14, fill: '#111' });
  el('text', { x: X0 + 45, y: rootY + 5, fill: '#fff', 'text-anchor': 'middle', 'font-weight': 700 }, ch.name || channel);
  const wrap = h('div', { style: 'overflow-x:auto' }); wrap.append(svg); return wrap;
}


/* ===================== 歌庫(已上線的歌,唯讀) ===================== */
let lib = null, libQuery = '', libChannel = '';
function viewLibrary() {
  const box = h('div');
  if (!lib) {
    box.append(h('p', { class: 'muted' }, '載入中…'));
    fetch('/api/admin/library').then((r) => r.json()).then((j) => { lib = j; if (view === 'lib') render(); }).catch(() => { box.textContent = '載入失敗'; });
    return box;
  }
  const chName = (id) => (id ? lib.channels[id] || id : '節目');
  const gName = (id) => (id ? lib.genres[id] || id : '');
  const mmss = (s) => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  const tracks = lib.tracks.filter((t) => (!libChannel || t.channel === libChannel) && (!libQuery || (t.title + ' ' + t.artist + ' ' + t.id).toLowerCase().includes(libQuery.toLowerCase())));
  const sel = h('select', { onchange: (e) => { libChannel = e.target.value; render(); } }, h('option', { value: '' }, '全部頻道'),
    ...[...new Set(lib.tracks.map((t) => t.channel))].map((c) => h('option', { value: c }, chName(c))));
  sel.value = libChannel;
  const q = h('input', { type: 'text', placeholder: '搜尋曲名 / 創作者', value: libQuery, style: 'max-width:240px' });
  q.addEventListener('change', () => { libQuery = q.value; render(); });
  q.addEventListener('keydown', (e) => { if (e.key === 'Enter') { libQuery = q.value; render(); } });
  const perChannel = {};
  for (const t of lib.tracks) { const k = chName(t.channel); perChannel[k] = (perChannel[k] || 0) + 1; }
  const total = lib.tracks.reduce((s, t) => s + t.seconds, 0);
  box.append(
    h('div', { class: 'help' }, '這裡是「已經部署上線」的歌(轉檔後要 deploy 才會出現)。共 ' + lib.tracks.length + ' 首、約 ' + Math.round(total / 60) + ' 分鐘:' + Object.entries(perChannel).map(([k, v]) => k + ' ' + v).join('、')),
    h('div', { class: 'row' }, sel, q, h('span', { class: 'muted' }, '顯示 ' + tracks.length + ' 首(輸入後按 Enter 搜尋)')),
    h('table', null,
      h('thead', null, h('tr', null, ['頻道', '曲風', '創作者', '曲名', '長度', 'id'].map((t) => h('th', null, t)))),
      h('tbody', null, ...tracks.map((t) => h('tr', null, h('td', null, chName(t.channel)), h('td', null, gName(t.genre)), h('td', null, t.artist), h('td', null, t.title), h('td', null, mmss(t.seconds)), h('td', { class: 'id' }, t.id))))));
  return box;
}

function viewSettings() {
  const ch = cfgOf();
  const base = h('textarea', { rows: 3 }); base.value = ch.base;
  const axes = h('textarea', { rows: 14, style: 'font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.85rem' });
  axes.value = JSON.stringify(ch.axes, null, 2);
  const target = h('input', { type: 'number', value: ch.target, style: 'width:80px' });
  const excl = h('input', { type: 'text', value: db.cfg.exclude });
  const msg = h('span', { class: 'muted' });
  return h('div', null,
    h('div', { class: 'help' }, '這裡改的是「' + ch.name + '」頻道的基底提示詞與各軸選項。新增或刪除選項後,舊紀錄不會被改動。'),
    h('p', null, h('strong', null, '基底提示詞')), base,
    h('p', null, h('strong', null, '變化軸(JSON:{"軸名":["選項1","選項2"]})')), axes,
    h('div', { class: 'row' }, '目標首數:', target),
    h('p', null, h('strong', null, 'Exclude 排除詞(全部頻道共用)')), excl,
    h('div', { class: 'row' },
      h('button', { class: 'btn primary', onclick: () => {
        try {
          const parsed = JSON.parse(axes.value);
          if (!parsed || typeof parsed !== 'object' || Object.values(parsed).some((v) => !Array.isArray(v) || !v.length)) throw new Error('每個軸都要是「非空的選項陣列」');
          ch.base = base.value.trim(); ch.axes = parsed; ch.target = Number(target.value) || ch.target; db.cfg.exclude = excl.value.trim();
          save(); msg.textContent = '已儲存'; renderHeader();
        } catch (e) { msg.textContent = '格式錯誤:' + e.message; }
      } }, '儲存設定'),
      h('button', { class: 'btn', onclick: () => { if (confirm('把「' + ch.name + '」恢復成預設設定?(紀錄不受影響)')) { db.cfg.channels[channel] = JSON.parse(JSON.stringify(DEFAULT_CFG.channels[channel] || ch)); save(); render(); } } }, '恢復預設'),
      msg));
}

/* ===================== 匯出入 ===================== */
function download(name, text, type) {
  const a = h('a', { href: URL.createObjectURL(new Blob([text], { type })), download: name });
  document.body.append(a); a.click(); a.remove();
}
$('btnCsv').onclick = () => {
  const names = [...new Set(Object.values(db.cfg.channels).flatMap((c) => Object.keys(c.axes)))];
  const esc = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
  const rows = [['編號', '頻道', '狀態', '留下首數', '歌名', '備註', ...names, '完整提示詞', '建立時間']];
  for (const r of db.log) rows.push([r.id, r.channel, STATUS[r.status] || r.status, songCount(r), r.title, r.note, ...names.map((a) => r.picks[a] || ''), cfgOf(r.channel) ? buildPrompt(cfgOf(r.channel), r.picks) : '', r.createdAt]);
  download('suno-prompts-' + new Date().toISOString().slice(0, 10) + '.csv', '﻿' + rows.map((r) => r.map(esc).join(',')).join('\n'), 'text/csv');
};
$('btnJson').onclick = () => download('suno-tracker-backup-' + new Date().toISOString().slice(0, 10) + '.json', JSON.stringify(db, null, 1), 'application/json');
$('fileImport').onchange = async (e) => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    // 相容兩種格式:這個網頁的備份({cfg,log}),或指令版的 prompts/log.json(純陣列)
    const incoming = Array.isArray(data) ? { cfg: db.cfg, log: data } : data;
    if (!incoming.log || !incoming.cfg) throw new Error('不是有效的備份檔');
    if (!confirm('匯入會「取代」目前的所有紀錄(' + db.log.length + ' 筆 → ' + incoming.log.length + ' 筆)。確定嗎?')) return;
    db = incoming; channel = Object.keys(db.cfg.channels)[0]; save(); render();
  } catch (err) { alert('匯入失敗:' + err.message); }
  e.target.value = '';
};

/* ===================== 外框 ===================== */
function renderHeader() {
  $('channelTabs').replaceChildren(...Object.entries(db.cfg.channels).map(([id, c]) =>
    h('button', { class: 'tab' + (id === channel ? ' active' : ''), onclick: () => { channel = id; lastBatch = []; render(); } }, c.name || id)));
  const kept = logOf().reduce((sum, r) => sum + songCount(r), 0), t = cfgOf().target || 20; // 留下的「首數」
  $('progressText').textContent = '目前頻道:' + (cfgOf().name || channel) + ' ・ 留下 ' + kept + ' 首 / 目標 ' + t + ' 首(待聽 ' + logOf().filter((r) => r.status === 'pending').length + ' 組提示詞)';
  $('progressBar').style.width = Math.min(100, (kept / t) * 100) + '%';
  $('viewTabs').replaceChildren(...[['gen', '產生'], ['log', '紀錄'], ['cov', '覆蓋率 & 心智圖'], ['lib', '歌庫'], ['set', '設定']].map(([k, label]) =>
    h('button', { class: 'tab' + (view === k ? ' active' : ''), onclick: () => { view = k; render(); } }, label)));
}
function render() {
  renderHeader();
  $('view').replaceChildren({ gen: viewGen, log: viewLog, cov: viewCoverage, lib: viewLibrary, set: viewSettings }[view]());
}
/* ===================== 登入檢查與啟動 ===================== */
function showAuth(status, me) {
  $('view').replaceChildren();
  const box = h('div', { class: 'card', style: 'max-width:460px;margin:40px auto;text-align:center' });
  if (status === 401) {
    box.append(h('h3', null, '請先登入管理員帳號'), h('p', { class: 'muted' }, '這個頁面只有管理員看得到。'));
    box.append(h('a', { class: 'btn primary', href: '/auth/login?next=/tracker' }, '用 Google 登入'));
    if (me && me.devLogin) {
      const input = h('input', { type: 'text', placeholder: '開發測試:輸入 email' });
      box.append(h('form', { class: 'row', style: 'justify-content:center', onsubmit: (e) => { e.preventDefault(); location.href = '/auth/dev?email=' + encodeURIComponent(input.value) + '&next=/tracker'; } }, input, h('button', { class: 'btn' }, '登入')));
    }
      } else {
    box.append(h('h3', null, '沒有權限'), h('p', { class: 'muted' }, '目前登入的帳號(' + ((me && me.email) || '') + ')不是管理員。管理員帳號要列在 wrangler.toml 的 ADMIN_EMAILS。'),
      h('button', { class: 'btn', onclick: async () => { await fetch('/auth/logout', { method: 'POST' }); location.reload(); } }, '登出換帳號'));
  }
  $('view').append(box);
}

async function boot() {
  $('view').textContent = '載入中…';
  const me = await fetch('/api/me').then((r) => r.json()).catch(() => null);
  const r = await fetch('/api/tracker');
  if (r.status === 401 || r.status === 403) return showAuth(r.status, me);
  if (!r.ok) { $('view').textContent = '載入失敗:HTTP ' + r.status; return; }
  const j = await r.json();
  DEFAULT_CFG = j.defaultCfg;
  version = j.version;
  db = j.data && j.data.cfg ? j.data : { cfg: JSON.parse(JSON.stringify(DEFAULT_CFG)), log: [] };
  // 預設設定新增了頻道時,補進來(不動你已經修改過的頻道)
  for (const [id, c] of Object.entries(DEFAULT_CFG.channels)) if (!db.cfg.channels[id]) db.cfg.channels[id] = JSON.parse(JSON.stringify(c));
  if (!db.cfg.exclude) db.cfg.exclude = DEFAULT_CFG.exclude;
  channel = Object.keys(db.cfg.channels)[0];
  $('who').textContent = j.email;
  if (me && me.adminConsoleUrl) $('hubLink').href = me.adminConsoleUrl;
  $('saved').textContent = j.updatedAt ? '雲端最後更新 ' + new Date(j.updatedAt).toLocaleString() : '';

  // 一次性搬家:這個瀏覽器如果有舊的「本機版」資料,而雲端還是空的,問要不要上傳
  if (!j.data) {
    try {
      const old = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
      if (old && Array.isArray(old.log) && old.log.length && confirm('偵測到這個瀏覽器有舊的本機版資料(' + old.log.length + ' 筆紀錄)。要上傳到雲端嗎?')) {
        db = old;
        for (const [id, c] of Object.entries(DEFAULT_CFG.channels)) if (!db.cfg.channels[id]) db.cfg.channels[id] = c;
        channel = Object.keys(db.cfg.channels)[0];
        save();
      }
    } catch (e) { /* ignore */ }
  }
  render();
}
boot();
