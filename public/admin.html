<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>電台後台</title>
<link rel="stylesheet" href="/theme.css" />
<link rel="stylesheet" href="/player.css" />
<style>main.admin { max-width: 980px; } td .btn { white-space: nowrap; }</style>
</head>
<body>
<header class="top"><span class="brand">使用者後台</span><span class="spacer"></span><a class="btn small" href="/tracker">提示詞與歌庫</a><a class="btn small" href="/">回播放器</a></header>
<main class="app admin">
  <p id="msg" class="muted">載入中…</p>
  <div id="panel" class="panel hidden">
    <h3>開通 / 關閉使用者</h3>
    <p class="muted">這裡的「手動啟用」和 Stripe 訂閱是兩個獨立開關,任一個開著就能收聽。可以先輸入對方的 Google 信箱預先開通,對方登入後立刻生效。</p>
    <form id="add" class="row">
      <input id="add-email" type="email" placeholder="Google 信箱" required style="max-width:280px" />
      <input id="add-note" type="text" placeholder="備註(例如:A 咖啡店)" style="max-width:260px" />
      <button class="btn primary">手動啟用</button>
    </form>
    <table>
      <thead><tr><th>信箱</th><th>狀態</th><th>手動啟用</th><th>訂閱</th><th>備註</th><th>最後登入</th><th></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  async function call(method, body) {
    const r = await fetch('/api/admin/users', { method, headers: { 'content-type': 'application/json' }, body: body ? JSON.stringify(body) : undefined });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || 'HTTP ' + r.status), { status: r.status });
    return data;
  }
  const cell = (t) => { const td = document.createElement('td'); td.append(t); return td; };
  async function load() {
    try {
      const { users } = await call('GET');
      $('msg').classList.add('hidden'); $('panel').classList.remove('hidden');
      $('rows').replaceChildren(...users.map((u) => {
        const tr = document.createElement('tr');
        const btn = document.createElement('button');
        btn.className = 'btn small' + (u.adminGrant ? ' danger' : '');
        btn.textContent = u.adminGrant ? '取消手動啟用' : '手動啟用';
        btn.onclick = async () => { await call('POST', { email: u.email, adminGrant: !u.adminGrant }); load(); };
        tr.append(
          cell(u.email), cell(u.entitled ? '✅ 可收聽' : '⛔ 未開通'), cell(u.adminGrant ? '是' : '—'),
          cell(u.stripeActive ? '訂閱中' : '—'), cell(u.note || ''),
          cell(u.lastLogin ? new Date(u.lastLogin).toLocaleString() : '尚未登入'), cell(btn));
        return tr;
      }));
    } catch (e) {
      $('msg').textContent = e.status === 403 ? '沒有權限。請先在播放器頁用管理員的 Google 帳號登入(帳號要列在 ADMIN_EMAILS)。' : '載入失敗:' + e.message;
    }
  }
  $('add').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    await call('POST', { email: $('add-email').value, adminGrant: true, note: $('add-note').value });
    $('add-email').value = ''; $('add-note').value = ''; load();
  });
  load();
})();
</script>
</body>
</html>
