<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Radio Hum — 黑白極簡播放器設計稿(假資料)</title>
<style>
  /* 只有黑、白、灰。沒有任何彩色。深色卡片與淺色卡片只是把這組變數對調。 */
  :root { --page:#ffffff; --sans: system-ui,-apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif; --mono: ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); font-family:var(--sans); color:#111; padding:28px 18px 60px; }
  h1 { font-size:14px; font-weight:600; margin:0 0 4px; } .hint { color:#8a8a8e; font-size:12px; margin:0 0 22px; }
  .sheet { display:grid; grid-template-columns:repeat(auto-fit,minmax(320px,360px)); gap:22px 26px; justify-content:center; align-items:start; }
  .col { display:flex; flex-direction:column; gap:22px; }

  .dark  { --bg:#1c1c1f; --panel:#2b2b2f; --fg:#ffffff; --muted:#8e8e93; --line:#3d3d42; --btn:#ffffff; --btnfg:#111111; --bar:#ffffff; --bar-dim:#55555a; }
  .light { --bg:#f0f0f1; --panel:#ffffff; --fg:#111111; --muted:#8a8a8e; --line:#d6d6da; --btn:#111111; --btnfg:#ffffff; --bar:#111111; --bar-dim:#c4c4c8; }

  .card { background:var(--bg); color:var(--fg); border-radius:26px; padding:18px 20px 20px; display:flex; flex-direction:column; gap:14px; position:relative; }
  .top { display:flex; align-items:center; justify-content:space-between; font:600 10px var(--mono); letter-spacing:.2em; color:var(--muted); }
  .live::before { content:"● "; } .paused .live { opacity:.5; }
  .pills { display:flex; gap:6px; overflow-x:auto; scrollbar-width:none; }
  .pills::-webkit-scrollbar { display:none; }
  .pill { flex:none; font:inherit; font-size:12px; color:var(--muted); background:none; border:1px solid var(--line); border-radius:999px; padding:4px 12px; cursor:pointer; }
  .pill[aria-pressed="true"] { background:var(--fg); color:var(--bg); border-color:var(--fg); }

  /* 取代封面的方形:這個電台沒有專輯封面,所以用「正在跳動的聲音」當主視覺 */
  .viz { background:var(--panel); border-radius:18px; height:170px; display:flex; align-items:center; justify-content:center; gap:3px; padding:0 18px; position:relative; overflow:hidden; }
  .viz .bars { display:flex; align-items:center; gap:3px; height:100%; width:100%; justify-content:space-between; }
  .viz .bars i { display:block; flex:1; max-width:5px; background:var(--bar); border-radius:3px; height:6px; opacity:.92; }
  .recipe { position:absolute; inset:0; background:var(--panel); padding:10px 18px; display:none; flex-direction:column; justify-content:center; gap:0; font-size:12.5px; }
  .recipe.on { display:flex; }
  .recipe div { display:flex; justify-content:space-between; border-bottom:1px solid var(--line); padding:4px 0; } .recipe div span:first-child { color:var(--muted); }
  .recipe small { color:var(--muted); font-size:10px; margin-top:6px; line-height:1.3; }

  .info { display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .title { margin:0; font-size:26px; line-height:1.15; font-weight:700; letter-spacing:-.01em; }
  .sub { margin:4px 0 0; color:var(--muted); font-size:12.5px; }
  .icon { background:none; border:0; color:var(--fg); width:36px; height:36px; display:grid; place-items:center; cursor:pointer; border-radius:50%; flex:none; padding:0; }
  .icon:hover { background:var(--line); } .icon svg { width:20px; height:20px; fill:currentColor; }
  .icon.on { background:var(--fg); color:var(--bg); }

  .prog { height:3px; background:var(--line); border-radius:3px; position:relative; }
  .prog i { position:absolute; left:0; top:0; bottom:0; background:var(--fg); border-radius:3px; }
  .prog i::after { content:""; position:absolute; right:-5px; top:-3.5px; width:10px; height:10px; border-radius:50%; background:var(--fg); }
  .times { display:flex; justify-content:space-between; font:10px var(--mono); color:var(--muted); margin-top:-6px; letter-spacing:.06em; }

  .ctrl { display:flex; align-items:center; justify-content:space-between; }
  .ctrl .side { display:flex; align-items:center; gap:14px; }
  .play { width:64px; height:64px; border-radius:50%; border:0; background:var(--btn); color:var(--btnfg); display:grid; place-items:center; cursor:pointer; transition:transform .1s; padding:0; }
  .play:active { transform:scale(.94); } .play svg { width:26px; height:26px; fill:currentColor; }
  .vol { display:flex; align-items:center; gap:6px; color:var(--muted); } .vol input { width:70px; accent-color:var(--fg); height:3px; }
  .genres { display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .genres .pill { font-size:11px; padding:3px 10px; }

  /* 迷你版:給店家嵌在網站裡的那一條 */
  .mini { background:var(--bg); color:var(--fg); border-radius:18px; padding:10px 14px; display:flex; align-items:center; gap:12px; }
  .mini .mv { width:52px; height:52px; border-radius:12px; background:var(--panel); display:flex; align-items:center; justify-content:center; gap:2px; padding:0 8px; flex:none; }
  .mini .mv i { flex:1; display:block; background:var(--bar); border-radius:2px; height:4px; }
  .mini .txt { flex:1; min-width:0; } .mini .t { font-weight:700; font-size:15px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } .mini .s { color:var(--muted); font-size:11.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mini .play { width:42px; height:42px; } .mini .play svg { width:18px; height:18px; }
  .label { font:600 10px var(--mono); letter-spacing:.14em; color:#8a8a8e; margin:0 0 -12px 4px; text-transform:uppercase; }
</style>
</head>
<body>
<h1>黑白極簡播放器 — 設計稿</h1>
<p class="hint">假資料。可以點頻道、按播放(看聲音跳動)、按 ⓘ(看這首歌的配方)、按左右箭頭換頻道。</p>
<div class="sheet" id="sheet"></div>

<script>
  const CH = [
    { name:'想放空', sub:'週日午後 · 雨窗', genres:['都可以','Lo-fi','Ambient'] },
    { name:'想專心', sub:'圖書館 · 檯燈', genres:['都可以','Bossa Nova','Jazz'] },
    { name:'想上路', sub:'海岸公路 · 夕陽', genres:['都可以','City Pop','Funk'] },
    { name:'想熬夜', sub:'凌晨兩點 · 霓虹', genres:['都可以','Smooth Jazz'] },
    { name:'隨便聽聽', sub:'全部混播', genres:['都可以'] },
  ];
  const SONGS = [
    { bpm:72, lead:'木吉他', scene:'雨窗', fx:'輕雨聲', mood:'慢慢演變的質地' },
    { bpm:80, lead:'顫音琴', scene:'下雨的午後', fx:'—', mood:'留白很多' },
    { bpm:115, lead:'薩克斯風', scene:'夕陽海岸公路', fx:'—', mood:'穩定律動' },
    { bpm:62, lead:'弱音小號', scene:'雨中霓虹', fx:'—', mood:'慢慢堆疊、不大聲' },
    { bpm:72, lead:'木吉他', scene:'雨窗', fx:'輕雨聲', mood:'慢慢演變的質地' },
  ];
  const IC = {
    play:'<svg viewBox="0 0 24 24"><path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2z"/></svg>',
    pause:'<svg viewBox="0 0 24 24"><rect x="6" y="5" width="4.6" height="14" rx="1.3"/><rect x="13.4" y="5" width="4.6" height="14" rx="1.3"/></svg>',
    prev:'<svg viewBox="0 0 24 24"><path d="M6 6h2.2v12H6zM9.6 12l9-6.2v12.4z"/></svg>',
    next:'<svg viewBox="0 0 24 24"><path d="M15.8 6H18v12h-2.2zM14.4 12l-9 6.2V5.8z"/></svg>',
    vol:'<svg viewBox="0 0 24 24"><path d="M3 9.5v5h3.6L11 19V5L6.6 9.5H3zm12.5 2.5a4 4 0 0 0-2-3.5v7a4 4 0 0 0 2-3.5z"/></svg>',
    info:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1.1 15h-2.2v-6h2.2v6zm0-8.1h-2.2V6.8h2.2v2.1z"/></svg>',
  };
  let ch = 0, genre = 0, playing = false, t = 42, showRecipe = false;
  const LEN = 200, fmt = (s) => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  const song = () => SONGS[ch % SONGS.length];
  const tags = () => { const s = song(); return [s.bpm+' BPM', s.lead, s.scene].join(' · '); };

  function card(theme) {
    const s = song();
    return `<article class="card ${theme} ${playing ? '' : 'paused'}" data-theme="${theme}">
      <div class="top"><span>RADIO HUM</span><span class="live">LIVE</span></div>
      <div class="pills">${CH.map((c,i)=>`<button class="pill" data-ch="${i}" aria-pressed="${i===ch}">${c.name}</button>`).join('')}</div>
      <div class="viz"><div class="bars">${'<i></i>'.repeat(34)}</div>
        <div class="recipe ${showRecipe?'on':''}">
          ${[['速度',s.bpm+' BPM'],['主奏',s.lead],['場景',s.scene],['點綴',s.fx],['氛圍',s.mood]].map(([k,v])=>`<div><span>${k}</span><span>${v}</span></div>`).join('')}
          <small>AI 生成這首歌時的方向,實際聽感可能有些出入。</small></div></div>
      <div class="info"><div><h2 class="title">${CH[ch].name}</h2><p class="sub">${tags()}</p></div>
        <button class="icon ${showRecipe?'on':''}" data-act="recipe" title="這首歌的配方" aria-label="配方">${IC.info}</button></div>
      <div><div class="prog"><i style="width:${t/LEN*100}%"></i></div></div>
      <div class="times"><span>${fmt(t)}</span><span>-${fmt(LEN-t)}</span></div>
      <div class="ctrl">
        <label class="vol">${IC.vol}<input type="range" min="0" max="1" step="0.01" value="0.8" aria-label="音量"></label>
        <div class="side"><button class="icon" data-act="prev" title="上一個頻道" aria-label="上一個頻道">${IC.prev}</button>
          <button class="play" data-act="play" aria-label="${playing?'暫停':'播放'}">${playing?IC.pause:IC.play}</button>
          <button class="icon" data-act="next" title="下一個頻道" aria-label="下一個頻道">${IC.next}</button></div>
        <span style="width:76px"></span>
      </div>
      ${CH[ch].genres.length>1 ? `<div class="genres">${CH[ch].genres.map((g,i)=>`<button class="pill" data-genre="${i}" aria-pressed="${i===genre}">${g}</button>`).join('')}</div>` : ''}
    </article>`;
  }
  function mini(theme) {
    return `<div class="mini ${theme}"><div class="mv">${'<i></i>'.repeat(7)}</div>
      <div class="txt"><div class="t">${CH[ch].name}</div><div class="s">${tags()}</div></div>
      <button class="play" data-act="play" aria-label="播放 / 暫停">${playing?IC.pause:IC.play}</button></div>`;
  }
  function render() {
    $sheet.innerHTML =
      `<div class="col"><p class="label">主播放器 · 深色</p>${card('dark')}</div>
       <div class="col"><p class="label">主播放器 · 淺色</p>${card('light')}</div>
       <div class="col"><p class="label">迷你版(嵌入店家網站用)</p>${mini('dark')}${mini('light')}</div>`;
  }
  const $sheet = document.getElementById('sheet');
  $sheet.addEventListener('click', (e) => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.ch != null) { ch = +b.dataset.ch; genre = 0; t = 0; }
    else if (b.dataset.genre != null) { genre = +b.dataset.genre; }
    else if (b.dataset.act === 'play') { playing = !playing; }
    else if (b.dataset.act === 'recipe') { showRecipe = !showRecipe; }
    else if (b.dataset.act === 'prev') { ch = (ch + CH.length - 1) % CH.length; genre = 0; t = 0; }
    else if (b.dataset.act === 'next') { ch = (ch + 1) % CH.length; genre = 0; t = 0; }
    else return;
    render();
  });
  setInterval(() => { if (!playing) return; t = (t + 1) % LEN; document.querySelectorAll('.prog i').forEach(i => i.style.width = (t/LEN*100)+'%'); document.querySelectorAll('.times span:first-child').forEach(x => x.textContent = fmt(t)); document.querySelectorAll('.times span:last-child').forEach(x => x.textContent = '-' + fmt(LEN-t)); }, 1000);

  // 聲音跳動(正式版用 Web Audio 的即時分析;這裡用假資料)
  function frame() {
    const now = performance.now()/1000;
    document.querySelectorAll('.bars').forEach((bars) => [...bars.children].forEach((b, k, arr) => {
      const mid = 1 - Math.abs(k - arr.length/2) / (arr.length/2) * 0.55;       // 中間高、兩側低
      const target = playing ? 8 + 120 * mid * Math.abs(Math.sin(now*(1.1 + k*0.13) + k*0.7)) : 5;
      const h = parseFloat(b.dataset.h || 5); const n = h + (target - h) * 0.3; b.dataset.h = n; b.style.height = n.toFixed(1) + 'px';
    }));
    document.querySelectorAll('.mv').forEach((mv) => [...mv.children].forEach((b, k) => {
      const target = playing ? 6 + 30 * Math.abs(Math.sin(now*(1.4 + k*0.2) + k)) : 4;
      const h = parseFloat(b.dataset.h || 4); const n = h + (target - h) * 0.3; b.dataset.h = n; b.style.height = n.toFixed(1) + 'px';
    }));
    requestAnimationFrame(frame);
  }
  render(); frame();
</script>
</body>
</html>
